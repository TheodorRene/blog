[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro fingerprints everything under /_astro/, so it can be cached forever.
# Netlify's default is max-age=0, must-revalidate, which costs a round trip per
# asset on every page view.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Not fingerprinted, so a shorter life: these change only when overwritten.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
